[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "restore-ext-native"
requires-python = ">=3.8"
dynamic = ["version"]
description = "Rust core for file extension restoration from magic bytes"

[tool.maturin]
module-name = "restore_ext_native"    
features = ["pyo3/extension-module"]